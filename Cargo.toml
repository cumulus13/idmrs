[package]
name = "idmrs"
version = "0.1.20"
edition = "2021"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
description = "Drive Internet Download Manager (IDM) from Rust — usable as a CLI or as a library"
license = "MIT"
repository = "https://github.com/cumulus13/idmrs"
readme = "README.md"
keywords = ["idm", "download", "windows", "cli"]
categories = ["command-line-utilities", "api-bindings"]

[lib]
name = "idmrs"
path = "src/lib.rs"

[[bin]]
name = "idmrs"
path = "src/main.rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
clap-version-flag = "1.0.7"
clap-color-help = "0.1.3"
anyhow = "1"
thiserror = "1"
colored = "2"
arboard = { version = "3", default-features = false }
ini = { version = "0.21", package = "rust-ini" }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
] }
